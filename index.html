    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background-color: #f9fafb;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            height: 100vh;
            overflow: hidden;
        }
        
        #root {
            height: 100vh;
            width: 100vw;
        }
        
        /* iOS Safe Area */
        .safe-area-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* Prevent text selection on mobile */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 2px;
        }
        
        /* Loading spinner */
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Button press effect */
        .button-press:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }
        
        /* Fade in animation */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        console.log('Script loading...');

        // Mock Capacitor and BLE for development/testing
        if (typeof window.Capacitor === 'undefined') {
            console.log('Capacitor not available - setting up mocks');
            window.Capacitor = {
                isNativePlatform: () => false,
                getPlatform: () => 'web'
            };
            
            window.BleClient = {
                initialize: () => {
                    console.log('Mock BLE: initialize');
                    return Promise.resolve();
                },
                isEnabled: () => {
                    console.log('Mock BLE: isEnabled');
                    return Promise.resolve(false);
                },
                enable: () => {
                    console.log('Mock BLE: enable');
                    return Promise.reject(new Error('Bluetooth not available in browser'));
                },
                requestLEScan: (options, callback) => {
                    console.log('Mock BLE: requestLEScan');
                    return Promise.reject(new Error('Bluetooth LE not available in browser'));
                },
                stopLEScan: () => Promise.resolve(),
                connect: () => Promise.reject(new Error('Bluetooth connection not available in browser')),
                disconnect: () => Promise.resolve(),
                getServices: () => Promise.resolve([]),
                startNotifications: () => Promise.reject(new Error('Bluetooth notifications not available in browser')),
                stopNotifications: () => Promise.resolve(),
                write: () => Promise.reject(new Error('Bluetooth write not available in browser'))
            };
            
            window.numbersToDataView = (numbers) => new DataView(new Uint8Array(numbers).buffer);
            window.dataViewToNumbers = (dataView) => Array.from(new Uint8Array(dataView.buffer));
        } else {
            console.log('Capacitor available');

        const Shield = ({ size = 20, className = "" }) => (

        const Bluetooth = ({ size = 20, className = "" }) => (
            React.createElement('svg', {
                width: size,
                height: size,
                className: className,
                viewBox: "0 0 24 24",
                fill: "none",

                strokeWidth: "2"
            },
                React.createElement('path', { d: "m7 7 10 10-5 5V2l5 5L7 17" })
            )
        );

        // Main BMS Reader App Component
        const BMSReaderApp = () => {
            console.log('BMSReaderApp rendering...');
            
            const [isConnected, setIsConnected] = useState(false);
            const [isConnecting, setIsConnecting] = useState(false);
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [lastUpdate, setLastUpdate] = useState(null);
            const [connectionError, setConnectionError] = useState('');
            const [isBluetoothEnabled, setIsBluetoothEnabled] = useState(false);
            const [isNativeApp, setIsNativeApp] = useState(false);
            const [discoveredDevices, setDiscoveredDevices] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            
            const [bmsData, setBmsData] = useState({
                voltage: 48.2,
                current: -5.3,
                power: 255.5,
                soc: 85,
                temperature: 24.5,
                cycles: 147,
                capacity: 100,
                remainingCapacity: 85,
                cells: [
                    { id: 1, voltage: 3.412, temperature: 24.1 },
                    { id: 2, voltage: 3.408, temperature: 24.3 },
                    { id: 3, voltage: 3.415, temperature: 24.0 },
                    { id: 4, voltage: 3.410, temperature: 24.2 },
                    { id: 5, voltage: 3.411, temperature: 24.1 },
                    { id: 6, voltage: 3.409, temperature: 24.4 },
                    { id: 7, voltage: 3.413, temperature: 23.9 },
                    { id: 8, voltage: 3.407, temperature: 24.2 }
                ],
                balancing: false,
                charging: false,
                discharging: true,
                protection: {
                    overvoltage: false,
                    undervoltage: false,
                    overcurrent: false,
                    overtemperature: false,
                    shortCircuit: false,
                    chargeMosfet: true,
                    dischargeMosfet: true
                },
                rawData: 'DD 03 00 20 12 D2 EB 5C 00 64 00 64 00 93 00 00 55 4B 07 D0 00 00 55',
                bmsType: 'Demo Mode',
                deviceName: 'Demo BMS Device'
            });

            useEffect(() => {
                console.log('useEffect running...');
                
                const initializeApp = async () => {
                    try {
                        const isNative = window.Capacitor?.isNativePlatform() || false;
                        console.log('Is native app:', isNative);
                        setIsNativeApp(isNative);
                        
                        if (!isNative) {
                            setConnectionError('Aplikacja działa w trybie demo. Uruchom jako natywną aplikację dla pełnej funkcjonalności.');
                            
                            // Start demo data simulation
                            const demoInterval = setInterval(() => {
                                setBmsData(prev => ({
                                    ...prev,
                                    voltage: 48.0 + Math.random() * 0.8,
                                    current: -6.0 + Math.random() * 3.0,
                                    power: Math.abs((48.0 + Math.random() * 0.8) * (-6.0 + Math.random() * 3.0)),
                                    soc: Math.max(0, Math.min(100, prev.soc + (Math.random() - 0.5) * 1)),
                                    temperature: 24.0 + Math.random() * 3.0,
                                    cells: prev.cells.map(cell => ({
                                        ...cell,
                                        voltage: 3.4 + Math.random() * 0.05,
                                        temperature: 24.0 + Math.random() * 2.0
                                    }))
                                }));
                                setLastUpdate(new Date());
                            }, 2000);
                            
                            return () => clearInterval(demoInterval);
                        } else {
                            // Initialize Bluetooth for native app
                            try {
                                if (window.BleClient) {
                                    await window.BleClient.initialize();
                                    const enabled = await window.BleClient.isEnabled();
                                    setIsBluetoothEnabled(enabled);
                                    console.log('Bluetooth enabled:', enabled);
                                }
                            } catch (error) {
                                console.error('Bluetooth init error:', error);
                                setConnectionError(`Błąd inicjalizacji Bluetooth: ${error.message}`);
                            }
                        }
                    } catch (error) {
                        console.error('App initialization error:', error);
                        setConnectionError(`Błąd inicjalizacji: ${error.message}`);
                    } finally {
                        setIsLoading(false);
                        console.log('App initialization completed');
                    }
                };
                
                initializeApp();
            }, []);

            const scanForBMSDevices = async () => {
                if (!isNativeApp) {
                    setConnectionError('Skanowanie wymaga natywnej aplikacji mobilnej');
                    return;
                }
                
                setIsConnecting(true);
                setConnectionError('Skanowanie urządzeń BMS...');
                setDiscoveredDevices([]);
                
                try {
                    if (window.BleClient) {
                        await window.BleClient.requestLEScan(
                            { 
                                services: [
                                    '0000ff00-0000-1000-8000-00805f9b34fb',
                                    '0000ffe0-0000-1000-8000-00805f9b34fb',
                                    '0000fff0-0000-1000-8000-00805f9b34fb'
                                ] 
                            },
                            (result) => {
                                console.log('Device found:', result);
                                if (result.device) {
                                    setDiscoveredDevices(prev => {
                                        const exists = prev.find(d => d.deviceId === result.device.deviceId);
                                        if (!exists) {
                                            return [...prev, { 
                                                ...result.device, 
                                                rssi: result.rssi || -50,
                                                bmsType: 'Unknown BMS'
                                            }];
                                        }
                                        return prev;
                                    });
                                }
                            }
                        );
                        
                        setTimeout(async () => {
                            try {
                                await window.BleClient.stopLEScan();
                                setIsConnecting(false);
                                if (discoveredDevices.length === 0) {
                                    setConnectionError('Nie znaleziono urządzeń BMS. Sprawdź czy BMS jest włączony i w zasięgu.');
                                } else {
                                    setConnectionError('');
                                }
                            } catch (error) {
                                console.error('Error stopping scan:', error);
                            }
                        }, 15000);
                    }
                } catch (error) {
                    console.error('Scan error:', error);
                    setConnectionError(`Błąd skanowania: ${error.message}`);
                    setIsConnecting(false);
                }
            };

            const connectToDevice = async (device) => {
                setIsConnecting(true);
                setConnectionError('Łączenie z urządzeniem...');
                
                try {
                    if (window.BleClient) {
                        await window.BleClient.connect(device.deviceId, (disconnectedDeviceId) => {
                            console.log('Device disconnected:', disconnectedDeviceId);
                            setIsConnected(false);
                            setConnectionError('Urządzenie zostało rozłączone');
                        });
                        
                        setIsConnected(true);
                        setConnectionError('');
                        setDiscoveredDevices([]);
                        setBmsData(prev => ({ 
                            ...prev, 
                            deviceName: device.name || 'BMS Device',
                            bmsType: device.bmsType || 'Unknown BMS'
                        }));
                        
                        console.log('Successfully connected to:', device.name);
                    }
                } catch (error) {
                    console.error('Connection error:', error);
                    setConnectionError(`Błąd połączenia: ${error.message}`);
                } finally {
                    setIsConnecting(false);
                }
            };

            const disconnectFromBMS = async () => {
                try {
                    if (window.BleClient && isConnected) {
                        // Implement actual disconnect logic here
                        console.log('Disconnecting from BMS...');
                    }
                    setIsConnected(false);
                    setConnectionError('');
                    setBmsData(prev => ({ ...prev, deviceName: 'Demo BMS Device', bmsType: 'Demo Mode' }));
                } catch (error) {
                    console.error('Disconnect error:', error);
                }
            };

            const refreshData = () => {
                console.log('Refreshing data...');
                setLastUpdate(new Date());
                
                if (!isNativeApp) {
                    // Update demo data
                    setBmsData(prev => ({

                        voltage: 48.0 + Math.random() * 0.8,

                        temperature: 24.0 + Math.random() * 3.0
                    }));
                }
            };

            const enableBluetooth = async () => {
                try {
                    if (window.BleClient) {
                        await window.BleClient.enable();
                        setIsBluetoothEnabled(true);
                        setConnectionError('');
                    }
                } catch (error) {

                    setConnectionError('Nie udało się włączyć Bluetooth. Włącz ręcznie w ustawieniach.');

            // Loading Screen Component
            const LoadingScreen = () => (

                        React.createElement('div', { className: "spinner mx-auto mb-4" }),
                        React.createElement('h1', { className: "text-2xl font-bold mb-2" }, 'BMS Reader'),
                        React.createElement('p', { className: "text-blue-100" }, 'Inicjalizacja...')
                    )
                )
            );

            // Tab Button Component
            const TabButton = ({ id, icon: Icon, label, active, onClick }) => (
                React.createElement('button', {
                    onClick: () => onClick(id),
                    className: `flex-1 flex flex-col items-center py-3 px-1 transition-colors button-press ${
                        active 
                            ? 'text-blue-600 bg-blue-50 border-t-2 border-blue-600' 
                            : 'text-gray-600 hover:text-blue-500'
                    }`
                }, 
                    React.createElement(Icon, { size: 20, className: "mb-1" }),
                    React.createElement('span', { className: "text-xs font-medium" }, label)
                )
            );

            // Device Card Component
            const DeviceCard = ({ device, onConnect }) => (
                React.createElement('div', { className: "bg-white p-4 rounded-lg border shadow-sm mb-3" },
                    React.createElement('div', { className: "flex justify-between items-start mb-2" },
                        React.createElement('div', { className: "flex-1" },
                            React.createElement('h3', { className: "font-medium text-gray-900" }, 
                                device.name || 'Nieznane urządzenie'
                            ),
                            React.createElement('p', { className: "text-sm text-gray-600" }, device.deviceId),
                            React.createElement('div', { className: "flex items-center space-x-2 mt-1" },
                                React.createElement('span', { className: "text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded" },
                                    device.bmsType || 'Unknown'
                                ),
                                React.createElement('span', { className: "text-xs text-gray-500" }, 
                                    `RSSI: ${device.rssi} dBm`
                                )
                            )
                        ),
                        React.createElement('button', {
                            onClick: () => onConnect(device),
                            disabled: isConnecting,
                            className: "bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 disabled:opacity-50 button-press"
                        }, 'Połącz')
                    )
                )
            );

            // Dashboard Tab Component
            const DashboardTab = () => (
                React.createElement('div', { className: "p-4 space-y-4 pb-20" },
                    // Environment Status
                    React.createElement('div', { 
                        className: `p-4 rounded-lg border-2 ${
                            isNativeApp ? 'bg-green-50 border-green-200' : 'bg-yellow-50 border-yellow-200'
                        }`
                    },
                        React.createElement('div', { className: "flex items-center space-x-2" },
                            isNativeApp ? 
                                React.createElement(Smartphone, { className: "text-green-600" }) :
                                React.createElement(Globe, { className: "text-yellow-600" }),
                            React.createElement('div', null,
                                React.createElement('span', { className: "font-medium block" },
                                    isNativeApp ? 'Aplikacja natywna' : 'Tryb demo'
                                ),
                                React.createElement('span', { className: "text-sm text-gray-700" },
                                    isNativeApp 
                                        ? `Platforma: ${window.Capacitor?.getPlatform() || 'unknown'}` 
                                        : 'Symulacja danych BMS - uruchom jako natywną aplikację'
                                )
                            )
                        )
                    ),

                    // Bluetooth Status (only for native)
                    isNativeApp && React.createElement('div', { 
                        className: `p-4 rounded-lg border-2 ${
                            isBluetoothEnabled ? 'bg-green-50 border-green-200' : 'bg-yellow-50 border-yellow-200'
                        }`
                    },
                        React.createElement('div', { className: "flex items-center justify-between" },

            return React.createElement('div', { className: "h-screen bg-gray-50 flex flex-col fade-in" },
                // Header
                React.createElement('div', { className: "bg-blue-600 text-white p-4 safe-area-top shadow-lg" },
                    React.createElement('h1', { className: "text-xl font-bold text-center" }, 'BMS Reader'),
                    React.createElement('p', { className: "text-center text-blue-100 text-sm" }, 
                        isNativeApp ? 'Monitor systemów BMS' : 'Tryb demonstracyjny'
                    )
                ),

                // Content Area
                React.createElement('div', { className: "flex-1 overflow-auto" },
                    renderCurrentTab()
                ),

                // Bottom Navigation
                React.createElement('div', { className: "bg-white border-t shadow-lg safe-area-bottom" },
                    React.createElement('div', { className: "flex" },
                        React.createElement(TabButton, {
                            id: "dashboard",
                            icon: Activity,
                            label: "Dashboard",
                            active: currentTab === 'dashboard',
                            onClick: setCurrentTab
                        }),
                        React.createElement(TabButton, {
                            id: "cells",
                            icon: Battery,
                            label: "Ogniwa",
                            active: currentTab === 'cells',
                            onClick: setCurrentTab
                        }),
                        React.createElement(TabButton, {
                            id: "settings",
                            icon: Settings,
                            label: "Ustawienia",
                            active: currentTab === 'settings',
                            onClick: setCurrentTab
                        })
                    )
                )
            );
        };

        // Initialize app
        console.log('Initializing BMSReaderApp...');
        
        // Wait for DOM to be ready
        const initApp = () => {
            console.log('DOM ready, mounting React app...');
            const rootElement = document.getElementById('root');
            if (rootElement) {
                ReactDOM.render(React.createElement(BMSReaderApp), rootElement);
                console.log('App mounted successfully');
            } else {
                console.error('Root element not found!');
            }
        };

        // Multiple initialization methods to ensure app loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        // Fallback initialization after a short delay
        setTimeout(() => {
            const rootElement = document.getElementById('root');
            if (rootElement && !rootElement.hasChildNodes()) {
                console.log('Fallback initialization...');
                initApp();
            }
        }, 100);

        // Handle device ready for Capacitor
        document.addEventListener('deviceready', () => {
            console.log('Capacitor device ready');
        });

        // Prevent zoom on double tap (iOS Safari)
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Handle window resize for mobile keyboards
        window.addEventListener('resize', () => {
            // Force recalculation of viewport height for mobile browsers
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        });

        // Initial viewport height calculation
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);

        // Status bar styling for Capacitor
        if (window.StatusBar) {
            window.StatusBar.styleDefault();
        }

        // Keyboard handling for Capacitor
        if (window.Keyboard) {
            window.Keyboard.setAccessoryBarVisible(false);
        }

        console.log('Script initialization completed');
    </script>
</body>
</html>
