<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS PWA & status bar look -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JK BMS Reader" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>JK BMS Reader</title>

    <!-- Favicon / icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/vite.svg" />

    <!-- Fonts: Inter (nice tabular-nums support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Base styles: safe-area, font, background gradient -->
    <style>
      :root {
        --bg-start: #eff6ff; /* tailwind: blue-50 */
        --bg-end: #ffffff;
        --text: #0f172a;     /* slate-900 */
        --muted: #475569;    /* slate-600 */
      }
      html, body, #root {
        height: 100%;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI,
          Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        background: linear-gradient(180deg, var(--bg-start), var(--bg-end));
        /* Safe area paddings for iOS notch */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Smooth scrolling & nicer scrollbar on iOS */
      * {
        -webkit-overflow-scrolling: touch;
      }
      /* Hide overscroll glow in some WKWebView cases */
      body {
        overscroll-behavior-y: none;
      }
      /* Improve button tap look */
      button {
        -webkit-tap-highlight-color: rgba(0,0,0,0.05);
      }
      /* UI helpers for React components */
      .safe-area-top { padding-top: env(safe-area-inset-top); }
      .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
    <!-- Tailwind CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind runtime config (optional)
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','Inter','system-ui','sans-serif'],
            },
          }
        }
      }
    </script>
  </head>
  <body>
    <noscript>Ta aplikacja wymaga włączonego JavaScriptu.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
